syntax = "proto3";

package search.v1;

import "google/protobuf/struct.proto";

option go_package = "github.com/theleeeo/laika/app/gen/search/v1;search";

service SearchService {
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc FederatedSearch(FederatedSearchRequest) returns (FederatedSearchResponse);
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);
}

message SearchRequest {
  string resource = 1;

  string query = 2;
  repeated Filter filters = 3;

  // Pagination (simple from/size)
  // TODO: Support page tokens?
  // TODO: Support pit:s?
  int32 page = 4;
  int32 page_size = 5;

  // TODO: Multiple fields? Why?
  repeated Sort sort = 6;

  bool include_source = 7;
}

message SearchHit {
  string id = 1;
  double score = 2;

  // The indexed document (source)
  google.protobuf.Struct source = 3;
}

message SearchResponse {
  int64 total = 1;
  repeated SearchHit hits = 2;
}

message FederatedSearchRequest {
  string query = 1;

  // The set of Resource Types to span. Required and non-empty; an empty set is
  // an InvalidArgument error (not "all") so newly-added Types are never
  // silently exposed.
  repeated string resources = 2;

  // Global filters, applied on root fields.* paths common to every requested
  // Type. Reuses the single-resource Filter message.
  repeated Filter filters = 3;

  // Pagination (simple from/size), same normalization as single-resource
  // Search (25 default, 100 cap).
  int32 page = 4;
  int32 page_size = 5;

  bool include_source = 6;
}

// A single cross-type hit. Keyed by (resource, id) since id alone is not
// globally unique across Types.
message FederatedHit {
  string resource = 1;
  string id = 2;
  double score = 3;

  // The indexed document (source)
  google.protobuf.Struct source = 4;
}

// Per-resource hit count within a federated response.
message ResourceCount {
  string resource = 1;
  int64 count = 2;
}

message FederatedSearchResponse {
  int64 total = 1;
  repeated FederatedHit hits = 2;
  repeated ResourceCount counts = 3;
}

enum FilterOp {
  FILTER_OP_UNSPECIFIED = 0;
  FILTER_OP_EQ = 1;          // term
  FILTER_OP_IN = 2;          // terms
  FILTER_OP_NEQ = 3;         // must_not(term); on nested relations: "no child matches"
  FILTER_OP_NOT_IN = 4;      // must_not(terms); on nested relations: "no child matches"
  FILTER_OP_GT = 5;          // range — numeric, date, ip fields
  FILTER_OP_GTE = 6;         // range
  FILTER_OP_LT = 7;          // range
  FILTER_OP_LTE = 8;         // range
  FILTER_OP_PREFIX = 9;      // prefix — keyword fields
  FILTER_OP_SUFFIX = 10;     // wildcard *v — keyword fields
  FILTER_OP_CONTAINS = 11;   // wildcard *v* — keyword fields
  FILTER_OP_EXISTS = 12;     // exists — takes no value
  FILTER_OP_NOT_EXISTS = 13; // must_not(exists) — takes no value
}

message Filter {
  // Example: "fields.status" (root field) or "b.name" (relation field)
  string field = 1;

  FilterOp op = 2;

  // Single-value ops: EQ, NEQ, GT, GTE, LT, LTE, PREFIX, SUFFIX, CONTAINS.
  // Values are strings for every field type; the server coerces them against
  // the field's mapping (numbers as "42", dates as ISO-8601 / epoch millis /
  // ES date math such as "now-7d"). EXISTS / NOT_EXISTS take no value.
  string value = 3;

  // Set ops: IN, NOT_IN.
  repeated string values = 4;

  // If you need nested filtering (e.g. c is mapped as "nested"):
  // nested_path="c", field="c.state", op=EQ, value="active"
  // Usually unnecessary: the server derives it for denormalized
  // many-relations.
  string nested_path = 5;
}

message Sort {
  // Example: "updated_at"
  string field = 1;
  bool desc = 2;
}

message GetCapabilitiesRequest {}

message GetCapabilitiesResponse { repeated ResourceCapability resources = 1; }

message ResourceCapability {
  string resource = 1;
  repeated FieldCapability fields = 2;
}

message FieldCapability {
  // The full path used in filters/sort, e.g. "fields.access_id" or "b.name"
  string field = 1;
  // The Elasticsearch field type, e.g. "keyword", "text", "integer"
  string type = 2;
  // Which filter operations are supported on this field
  repeated FilterOp filter_ops = 3;
  // Whether this field is included in full-text search queries
  bool searchable = 4;
  // Whether this field can be used for sorting
  bool sortable = 5;
}