syntax = "proto3";

package index.v1;

option go_package = "github.com/theleeeo/laika/app/gen/index/v1;index";

service IndexService {
  // NotifyChange informs the indexer that a resource has changed.
  // The indexer determines which search documents are affected and rebuilds
  // them from authoritative source data.
  rpc NotifyChange(NotifyChangeRequest) returns (NotifyChangeResponse);

  // NotifyChangeBatch is the batched version of NotifyChange. The batch
  // commits atomically: an error means nothing was recorded and the whole
  // batch may be retried; otherwise every notification has a status. An
  // unknown resource, or two notifications naming the same resource, fail
  // the whole batch with INVALID_ARGUMENT.
  rpc NotifyChangeBatch(NotifyChangeBatchRequest)
      returns (NotifyChangeBatchResponse);

  // Rebuild triggers a rebuild of one or more resource indices.
  // Jobs are enqueued and processed asynchronously by the job queue.
  rpc Rebuild(RebuildRequest) returns (RebuildResponse);
}

message NotifyChangeRequest { ChangeNotification notification = 1; }

message NotifyChangeResponse {}

message NotifyChangeBatchRequest {
  repeated ChangeNotification notifications = 1;
}

message NotifyChangeBatchResponse {
  // One per request notification, in request order.
  repeated ChangeStatus statuses = 1;
}

// ChangeStatus is one notification's outcome in NotifyChangeBatch.
enum ChangeStatus {
  CHANGE_STATUS_UNSPECIFIED = 0;
  // Recorded; its builds are scheduled.
  CHANGE_STATUS_ACCEPTED = 1;
  // A non-zero version not greater than the stored one; nothing was recorded.
  CHANGE_STATUS_STALE = 2;
}

// ChangeNotification describes a single resource change event from a source
// service.
message ChangeNotification {
  // The type of change.
  ChangeKind kind = 1;

  // The resource that changed.
  string resource_type = 2;
  string resource_id = 3;

  // Arbitrary caller-provided context of the resource (for example tenant,
  // trace, or trigger identifiers). It is stored on the resource's own row,
  // replacing what the row held, and every build of the resource that owns
  // it — inline, follow-up, sweep — passes what the row holds when it begins
  // to its provider calls. It never reaches the resource's Parents.
  map<string, string> metadata = 4;

  // Monotonically increasing version of the resource at the source.
  // When non-zero, the indexer rejects notifications whose version is not
  // strictly greater than the currently stored version (NotifyChange returns
  // FAILED_PRECONDITION, NotifyChangeBatch reports CHANGE_STATUS_STALE). Zero
  // means "no version control" — the notification is always accepted.
  // Ignored for delete notifications.
  int64 version = 5;
}

enum ChangeKind {
  CHANGE_KIND_UNSPECIFIED = 0;
  CHANGE_KIND_CREATED = 1;
  CHANGE_KIND_UPDATED = 2;
  CHANGE_KIND_DELETED = 3;
}

// ResourceSelector identifies a set of resources to rebuild.
// Empty resource_ids means "rebuild all" (discovered via ListResources on the
// provider). Empty versions means "all configured versions".
message ResourceSelector {
  string resource_type = 1;
  repeated int32 versions = 2;
  repeated string resource_ids = 3;

  // Arbitrary caller-provided fetch context of the rebuild (for example tenant
  // or trigger identifiers), passed to every provider call its walk makes. It
  // is never stored on a resource's row: the re-builds the walk's drift check
  // triggers fetch with their rows' own metadata.
  map<string, string> metadata = 4;
}

message RebuildRequest { repeated ResourceSelector selectors = 1; }

message RebuildResponse {
  // IDs of the Temporal RebuildWalk workflows started, one per selector.
  // Operators can inspect/retry/cancel them in the Temporal UI.
  repeated string workflow_ids = 1;
}
