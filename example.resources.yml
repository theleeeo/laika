resources:
  - type: a
    version: 1
    fields:
      fields:
        - name: searchField
          # search selects the full-text searchable tier this field feeds:
          #   primary   — the document's own high-signal text (search surface)
          #   secondary — lower-signal / denormalized-child text (search_scoped)
          #   none      — not full-text searchable (still filterable)
          # Omitted means none.
          query:
            search: primary
        - name: secondaryField
          type: text
          query:
            search: secondary
      relations:
        - resource: c
          join: { local: id, foreign: a_id }
          cardinality: many
          fields:
            - name: number
              type: integer

  - type: a
    version: 2
    fields:
      fields:
        - name: searchField
          query:
            search: primary
        - name: secondaryField
          type: text
          query:
            search: secondary
        - name: b_id
      relations:
        - resource: b
          join: { local: b_id, foreign: id }
          cardinality: one
          fields:
            - name: name
              query:
                search: primary
        - resource: c
          join: { local: id, foreign: a_id }
          cardinality: many
          fields:
            - name: number
              type: integer

  - type: b
    fields:
      - name: name
        query:
          search: primary

  - type: c
    fields:
      - name: number
    relations:
      - resource: a
        join: { local: a_id, foreign: id }
        fields:
          - name: searchField
            query:
              search: primary
          - name: b_id
      - resource: b
        join: { local: b_id, from: a, foreign: id }
        strategy: reference
        fields:
          - name: name
            # reference-relation fields are excluded from Federated Search
            # (their data is not denormalized into the parent), so a search tier
            # has no effect here; they remain searchable via single-resource
            # Search's two-phase join. Left as none.
            query:
              search: none
