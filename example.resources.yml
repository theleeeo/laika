resources:
  - type: a
    version: 1
    fields:
      fields:
        - name: searchField
        - name: secondaryField
          type: text
      relations:
        - resource: c
          join: { local: id, foreign: a_id }
          cardinality: many
          fields:
            - name: number
              type: integer

  - type: a
    version: 2
    fields:
      fields:
        - name: searchField
        - name: secondaryField
          type: text
        - name: b_id
      relations:
        - resource: b
          join: { local: b_id, foreign: id }
          cardinality: one
          fields:
            - name: name
        - resource: c
          join: { local: id, foreign: a_id }
          cardinality: many
          fields:
            - name: number
              type: integer

  - type: b
    fields:
      - name: name

  - type: c
    fields:
      - name: number
    relations:
      - resource: a
        join: { local: a_id, foreign: id }
        fields:
          - name: searchField
          - name: b_id
      - resource: b
        join: { local: b_id, from: a, foreign: id }
        strategy: reference
        fields:
          - name: name
            # Control whether this field is searchable or not.
            # It will still be filterable, just not available for full text search.
            # Default is true.
            query:
              search: false
