# App runtime configuration for cmd/indexer.
# Start with: APP_CONFIG_PATH=example.indexer.yml go run ./cmd/indexer
#
# Each key maps to an env var by uppercasing and replacing '.' with '_':
#   grpc.public_addr -> GRPC_PUBLIC_ADDR
#   grpc.admin_addr  -> GRPC_ADMIN_ADDR
#   es.addrs         -> ES_ADDRS  (comma-separated when set via env)
#   es.username      -> ES_USERNAME
#   es.password      -> ES_PASSWORD
#   pg.addr          -> PG_ADDR
#   provider.addr    -> PROVIDER_ADDR
#   resource_config_path -> RESOURCE_CONFIG_PATH
#   temporal.host_port  -> TEMPORAL_HOST_PORT
#   temporal.namespace  -> TEMPORAL_NAMESPACE
#   temporal.task_queue -> TEMPORAL_TASK_QUEUE
#   sweep.interval      -> SWEEP_INTERVAL
#   sweep.threshold     -> SWEEP_THRESHOLD
#   sweep.batch_size    -> SWEEP_BATCH_SIZE
#   pool.size           -> POOL_SIZE
#   pool.queue_size     -> POOL_QUEUE_SIZE
#   pool.queue_high_water -> POOL_QUEUE_HIGH_WATER
#   pool.owner_lease    -> POOL_OWNER_LEASE
# forward_walks has no env vars: it is a list, which doesn't map onto them.

# The surface is split across two listeners. Both serve gRPC, gRPC-Web, and the
# Connect protocol (HTTP POST + JSON) over HTTP/2 cleartext (h2c).
#   public_addr — read/search surface (SearchService); browser-facing (CORS).
#   admin_addr  — write/control surface (IndexService: NotifyChange,
#                 NotifyChangeBatch, Rebuild); no CORS, meant for internal use.
grpc:
  public_addr: ":9000"
  admin_addr: ":9010"

es:
  addrs:
    - "http://localhost:9200"
  username: ""
  password: ""
  # Federated Search execution experiment (or env ES_FEDERATED_EXECUTION):
  #   single-dfs (default) — one multi-index query, global DFS term statistics
  #   single               — one multi-index query, index-local statistics
  #   fanout               — one sub-search per Type via _msearch, merged client-side
  # federated_execution: single-dfs

pg:
  addr: "postgres://user:pass@localhost:5432/indexer"

# Required unless provided with PROVIDER_ADDR env var.
provider:
  addr: "localhost:50051"

resource_config_path: "resources.yml"

# Log level: debug | info | warn | error (default: info).
# Set to debug to trace the full search path, including reference resolution.
log:
  level: info

# Temporal drives the durable slow lane: the StaleSweep schedule and
# RebuildWalk workflows. The hot path (inline builds) works without it,
# but recovery and explicit rebuilds require the cluster.
temporal:
  host_port: "localhost:7233"
  namespace: "default"
  task_queue: "laika-indexer"

# The sweep rebuilds resources whose stale mark is older than threshold.
sweep:
  interval: "1m"
  threshold: "5m"
  batch_size: 500

# Bounded in-process pool for inline builds. size is the number of persistent
# workers; queue_size bounds accepted-but-not-yet-running builds — a full
# queue sheds new submissions to the sweep. queue_high_water is the queued-build
# count at or above which the pool is under pressure; 0 means 80% of queue_size.
# Only WaitForSlot registrations pace on it, and the app's RPCs never wait
# (ADR 0008), so it has no effect here yet. owner_lease is how long an inline
# build owns its resource without renewing: while it is live, a change to the
# resource on any instance submits no second build, and the owner runs one
# follow-up for it; 0 means 30s. Size it above a build's or delete's queue wait
# plus its run: a build or delete that outlives it costs a duplicate one, and a
# build that a delete overtakes and that writes more than Elasticsearch's
# index.gc_deletes (60s) after it brings the deleted document back.
pool:
  size: 10
  queue_size: 100
  queue_high_water: 0
  owner_lease: "0s"

# Scheduled forward walks: each enabled entry walks its resource type from the
# source on a schedule, so a resource created or changed without a notification
# is indexed. Each run walks the type once per metadata map (the walk's actor:
# an actor lists only what it can see, so give one map per actor when actors
# partition the source); no metadata means one walk with none. interval is how
# often a run starts (default 24h), page_size the listing page size each walk
# asks for (default 100), and page_interval a page's rate budget: a page that
# finishes sooner waits out the rest (default 1s). Leave a value out, or 0, for
# its default. Explicit rebuilds are not paced. One entry per type; resource
# types and metadata keys keep their case. No env overrides (see above).
# forward_walks:
#   - resource_type: product
#     enabled: true
#     interval: 24h
#     page_size: 100
#     page_interval: 1s
#     metadata:
#       - tenantId: a
#       - tenantId: b
