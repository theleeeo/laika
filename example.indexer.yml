# App runtime configuration for cmd/indexer.
# Start with: APP_CONFIG_PATH=example.indexer.yml GOEXPERIMENT=jsonv2 go run ./cmd/indexer
#
# Each key maps to an env var by uppercasing and replacing '.' with '_':
#   grpc.public_addr -> GRPC_PUBLIC_ADDR
#   grpc.admin_addr  -> GRPC_ADMIN_ADDR
#   es.addrs         -> ES_ADDRS  (comma-separated when set via env)
#   es.username      -> ES_USERNAME
#   es.password      -> ES_PASSWORD
#   pg.addr          -> PG_ADDR
#   provider.addr    -> PROVIDER_ADDR
#   resource_config_path -> RESOURCE_CONFIG_PATH
#   temporal.host_port  -> TEMPORAL_HOST_PORT
#   temporal.namespace  -> TEMPORAL_NAMESPACE
#   temporal.task_queue -> TEMPORAL_TASK_QUEUE
#   sweep.interval      -> SWEEP_INTERVAL
#   sweep.threshold     -> SWEEP_THRESHOLD
#   sweep.batch_size    -> SWEEP_BATCH_SIZE
#   pool.size           -> POOL_SIZE
#   pool.submit_wait    -> POOL_SUBMIT_WAIT

# The surface is split across two listeners. Both serve gRPC, gRPC-Web, and the
# Connect protocol (HTTP POST + JSON) over HTTP/2 cleartext (h2c).
#   public_addr — read/search surface (SearchService); browser-facing (CORS).
#   admin_addr  — write/control surface (IndexService: NotifyChange,
#                 NotifyChangeBatch, Rebuild); no CORS, meant for internal use.
grpc:
  public_addr: ":9000"
  admin_addr: ":9010"

es:
  addrs:
    - "http://localhost:9200"
  username: ""
  password: ""

pg:
  addr: "postgres://user:pass@localhost:5432/indexer"

# Required unless provided with PROVIDER_ADDR env var.
provider:
  addr: "localhost:50051"

resource_config_path: "resources.yml"

# Log level: debug | info | warn | error (default: info).
# Set to debug to trace the full search path, including reference resolution.
log:
  level: info

# Temporal drives the durable slow lane: the StaleSweep schedule and
# RebuildWalk workflows. The hot path (inline builds) works without it,
# but recovery and explicit rebuilds require the cluster.
temporal:
  host_port: "localhost:7233"
  namespace: "default"
  task_queue: "laika-indexer"

# The sweep rebuilds resources whose stale mark is older than threshold.
sweep:
  interval: "1m"
  threshold: "5m"
  batch_size: 500

# Bounded in-process pool for inline builds.
pool:
  size: 10
  submit_wait: "250ms"
